
services:
  mysql:
    image: mysql:8.4
    container_name: inventaris-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: inventaris_db
      MYSQL_USER: inventaris_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD belum diatur}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD belum diatur}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - inventaris-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build: .
    container_name: inventaris-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_NAME: "IT Inventory Dashboard"
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:5000}
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_NAME:-inventaris_db}
      DB_USERNAME: ${DB_USER:?DB_USER belum diatur}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD belum diatur}
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    ports:
      - "5000:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - inventaris-net

volumes:
  mysql_data:

networks:
  inventaris-net:
    driver: bridge
