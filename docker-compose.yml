
services:
  mysql:
    image: mysql:8.4
    container_name: inventaris-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: inventaris_db
      MYSQL_USER: inventaris_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD belum diatur}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD belum diatur}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - inventaris-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build: .
    container_name: inventaris-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - inventaris-net
  redis:
    image: redis:7-alpine
    container_name: inventaris-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - inventaris-net

volumes:
  mysql_data:

networks:
  inventaris-net:
    driver: bridge
